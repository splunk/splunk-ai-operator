applications:
  - name: Entrypoint
    import_path: main:SERVE_APP
    route_prefix: /
    deployments:
      - name: Entrypoint
        autoscaling_config:
          max_replicas: {{.Replicas.Entrypoint}}
          min_replicas: {{.Replicas.Entrypoint}}
          target_ongoing_requests: 20
    runtime_env:
      working_dir: "file:///home/ray/ray/applications/entrypoint.zip"
      env_vars:
        API_VERSION: "v1"
        APPLICATION_NAME: entrypoint
        ARTIFACTS_S3_BUCKET: "{{.ArtifactBucketName}}"
        S3_BUCKET: "{{.ArtifactBucketName}}"
        ARTIFACTS_PROVIDER: "{{.ArtifactsProvider}}"
        CLOUD_PROVIDER: "{{.CloudProvider}}"
        S3COMPAT_OBJECT_STORE_ENDPOINT_URL: "{{.S3CompatObjectStoreEndpointUrl}}"
        S3COMPAT_OBJECT_STORE_ACCESS_KEY: "{{.S3CompatObjectStoreAccessKey}}"
        S3COMPAT_OBJECT_STORE_SECRET_KEY: "{{.S3CompatObjectStoreSecretKey}}"
        # AWS / boto3 standard credential names — populated whenever the
        # operator can load credentials from spec.objectStorage.secretRef. For
        # CLOUD_PROVIDER=aws these are the values boto3 reads (the S3COMPAT_*
        # names above are only consumed by the s3compat shim). Both code paths
        # share the same source-of-truth Secret keys (s3_access_key /
        # s3_secret_key) so emitting both pairs is safe — each provider only
        # reads its own. AWS_REGION lets boto3 resolve the default regional S3
        # endpoint when no AWS_ENDPOINT_URL is set; required for any AWS S3
        # bucket outside us-east-1 to avoid PermanentRedirect on the first call.
        AWS_ACCESS_KEY_ID: "{{.S3CompatObjectStoreAccessKey}}"
        AWS_SECRET_ACCESS_KEY: "{{.S3CompatObjectStoreSecretKey}}"
        AWS_REGION: "{{.Region}}"
        AWS_DEFAULT_REGION: "{{.Region}}"
        ENABLE_AUTHN: "false"
        ENABLE_AUTHZ: "false"
        SERVICE_EXTERNAL_NAME: "ai-platform-models"
        SERVICE_INTERNAL_NAME: "ai_platform_models"
        SERVICE_NAME: "ai_platform_models"
        SKIP_VERIFICATION: "true"
        USE_SYSTEM_PERMISSIONS: "true"
{{- if .Replicas.Gemma431bIt }}
  - args:
      application_name: Gemma431bIt
      deployment_configs:
        LLMDeployment:
          gpu_type_options_override:
            H100:
              autoscaling_config:
                max_replicas: 1
                min_replicas: 1
                target_ongoing_requests: 6
              max_ongoing_requests: 8
              ray_actor_options:
                num_gpus: 1
            L40S:
              autoscaling_config:
                max_replicas: 1
                min_replicas: 1
                target_ongoing_requests: 4
              max_ongoing_requests: 6
              ray_actor_options:
                num_gpus: 2
            RTX_PRO_6000_BLACKWELL:
              autoscaling_config:
                max_replicas: 1
                min_replicas: 1
                target_ongoing_requests: 4
              max_ongoing_requests: 10
              ray_actor_options:
                num_gpus: 1
                resources:
                  "gpu_count:2": 0.001
                  "accelerator_type:RTX_PRO_6000_BLACKWELL": 0.001
          options:
            autoscaling_config:
              max_replicas: 1
              min_replicas: 1
      deployment_type: text_gen_model_deployment
      gpu_types: '["{{.AcceleratorType}}"]'
      model_definition:
        gpu_type_model_config_override:
          H100:
            engine_args:
              gpu_memory_utilization: 0.9
              enable_chunked_prefill: true
              async_scheduling: true
              max_num_batched_tokens: 8192
              tensor_parallel_size: 1
          L40S:
            engine_args:
              dtype: bfloat16
              gpu_memory_utilization: 0.85
              max_model_len: 120000
              max_num_batched_tokens: 4096
              max_num_seqs: 2
              tensor_parallel_size: 2
          RTX_PRO_6000_BLACKWELL:
            engine_args:
              dtype: bfloat16
              gpu_memory_utilization: 0.9
              max_model_len: 120000
              max_num_batched_tokens: 4096
              max_num_seqs: 1
              tensor_parallel_size: 1
        model_config:
          openai_serving_config:
            chat:
              enable_auto_tools: true
              reasoning_parser: gemma4
              tool_parser: gemma4
            responses:
              enable_auto_tools: true
              reasoning_parser: gemma4
              tool_parser: gemma4
        model_id: gemma4_31b_it
        model_loader:
          blob_storage:
            blob_prefix: model_artifacts/gemma-4-31b-it-qat-w4a16-ct
      tokenizer_definition:
        model_id: gemma4_31b_it
        model_loader:
          blob_storage:
            artifacts_list:
              - chat_template.jinja
              - config.json
              - processor_config.json
              - tokenizer_config.json
              - tokenizer.json
            blob_prefix: model_artifacts/gemma-4-31b-it-qat-w4a16-ct
    name: Gemma431bIt
    deployments:
      - name: LLMDeployment{{.AcceleratorType}}
        autoscaling_config:
          downscale_delay_s: 1800
          max_replicas: {{.Replicas.Gemma431bIt}}
          min_replicas: {{.Replicas.Gemma431bIt}}
          target_ongoing_requests: {{acceleratorValue .AcceleratorType 6 4 4}}
          upscale_delay_s: 10
      - name: TextGenModelDeployment
        max_ongoing_requests: {{textGenDriverRequestLimit (acceleratorValue .AcceleratorType 8 6 10) .Replicas.Gemma431bIt 20}}
    import_path: main:create_serve_app
    route_prefix: /gemma4_31b_it
    runtime_env:
      working_dir: "file:///home/ray/ray/applications/generic_application.zip"
      env_vars:
        API_VERSION: "v1"
        APPLICATION_NAME: gemma4_31b_it
        VLLM_ATTENTION_BACKEND: TRITON_ATTN
        ARTIFACTS_S3_BUCKET: "{{.ArtifactBucketName}}"
        S3_BUCKET: "{{.ArtifactBucketName}}"
        ARTIFACTS_PROVIDER: "{{.ArtifactsProvider}}"
        CLOUD_PROVIDER: "{{.CloudProvider}}"
        S3COMPAT_OBJECT_STORE_ENDPOINT_URL: "{{.S3CompatObjectStoreEndpointUrl}}"
        S3COMPAT_OBJECT_STORE_ACCESS_KEY: "{{.S3CompatObjectStoreAccessKey}}"
        S3COMPAT_OBJECT_STORE_SECRET_KEY: "{{.S3CompatObjectStoreSecretKey}}"
        # AWS / boto3 standard credential names — populated whenever the
        # operator can load credentials from spec.objectStorage.secretRef. For
        # CLOUD_PROVIDER=aws these are the values boto3 reads (the S3COMPAT_*
        # names above are only consumed by the s3compat shim). Both code paths
        # share the same source-of-truth Secret keys (s3_access_key /
        # s3_secret_key) so emitting both pairs is safe — each provider only
        # reads its own. AWS_REGION lets boto3 resolve the default regional S3
        # endpoint when no AWS_ENDPOINT_URL is set; required for any AWS S3
        # bucket outside us-east-1 to avoid PermanentRedirect on the first call.
        AWS_ACCESS_KEY_ID: "{{.S3CompatObjectStoreAccessKey}}"
        AWS_SECRET_ACCESS_KEY: "{{.S3CompatObjectStoreSecretKey}}"
        AWS_REGION: "{{.Region}}"
        AWS_DEFAULT_REGION: "{{.Region}}"
        ENABLE_AUTHN: "false"
        ENABLE_AUTHZ: "false"
        SERVICE_EXTERNAL_NAME: "ai-platform-models"
        SERVICE_INTERNAL_NAME: "ai_platform_models"
        SERVICE_NAME: "ai_platform_models"
        SKIP_VERIFICATION: "true"
        USE_SYSTEM_PERMISSIONS: "true"
        VLLM_WORKER_MULTIPROC_METHOD: spawn
        # Disable the Redis-backed Responses API store (see ai-platform-models
        # commit c1f9aef3: "feat: add a no-op store"). When True, the vLLM
        # TextGen deployment constructs NoOpOpenAIServingResponses instead of
        # RedisOpenAIServingResponses, so /v1/responses works without a Redis
        # infra. Without this flag the deployment raises
        #   RuntimeError: Responses Redis URL not set
        # on every request, which surfaces as an empty SSE stream and the SAIA
        # v2 /query path fails with "An error occurred processing your request".
        # Airgap k0s has no Redis; cloud sets this to "False" and wires
        # RESPONSES_REDIS_ADDRESS to its in-namespace Redis StatefulSet.
        DISABLE_RESPONSES_API_REDIS: "True"
{{- end }}
