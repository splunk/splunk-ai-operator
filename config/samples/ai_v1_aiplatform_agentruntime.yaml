apiVersion: ai.splunk.com/v1
kind: AIPlatform
metadata:
  name: agentruntime-sample
  namespace: ai-platform
spec:
  objectStorage:
    path: s3://ai-platform-dev
    region: us-west-2

  features:
    - name: agentruntime
      provider: mltk
      licenseSecretRef: las-auth
      postgresSecretRef: las-postgres
      redisSecretRef: las-redis
