        - name: PLATFORM_URL
          value: platform-url-origin
        - name: AI_TIER_AGENT_RUNTIME_URL
          value: agentruntime-service-origin
    aitk:
      role: AITK application dependency; not a container image
      delivery: Splunk app installed on Splunk
      appId: Splunk_ML_Toolkit
      appLabel: AI Toolkit
      appVersion: 6.2.0
      build: generated-at-package-time
      buildPolicy: gulpfile.js replaces @build@ with new Date().valueOf(); githash records the source commit
      source:
        repository: https://cd.splunkdev.com/ML/mltk/mltk
        branch: pmitra/aitk_app_runtime
        commit: 82ee65f54f210887740c3d594cc5609de92d39f2
      endpointContract:
        settingsPath: /services/mltk/ai_tier_settings
        basePath: /tenant/slim-api/v1alpha1
        agentPath: /agent/agent_runtime
        configuration: Connections > AI Tier saves the shared endpoint; GET/POST/DELETE settings handler
        authentication: Splunk authentication and config capabilities; Bearer interactive token from AITK to SLIM
  contract:
    runtimeAPI:
      prefix: /system/ai-agent-runtime/v1
      httpPort: 8080
      metricsPort: 9090
    slimAPI:
      basePath: /tenant/slim-api/v1alpha1
      agentPath: /agent/agent_runtime
      httpPort: 8080
      metricsPort: 8088
    loaderSelection:
      environmentVariable: AGENT_MODULE
      value: agentcore_operations.loader:MLTKAgentLoader
      evidence: story owner confirms this is the only required loader selection variable
    schemaEntryPoint:
      baseImage: postgres:16-alpine
      sqlPath: /schema.sql
      startup: wait for PostgreSQL with pg_isready, then apply SQL with psql
      operatorCommand: sh -c
      operatorSqlArguments:
        - -v
        - ON_ERROR_STOP=1
        - -f
        - /schema.sql
      idempotent: true
      evidence: schema setup Dockerfile and SQL at ai/ai-agent-runtime commit 5a91e680
    readinessAndHealth:
      appliesTo:
        - Agent Runtime
        - SLIM
      method: GET
      path: /health
      probes:
        - startup
        - liveness
        - readiness
      evidence: story-owner decision; existing operator probes already use this endpoint
      postgresConnectivity:
        startup: retain schema setup and runtime initialization checks
        periodic: not required
    tlsAndAuthentication:
      slimToRuntime: no application JWT or Authorization header required; internal ClusterIP route
      postgresAuthentication: password supplied through checkpoint DB Secret
      postgresTLS: provided Secret fields connect directly; no additional TLS mode or certificate configuration required
    secretKeys:
      referenceField: checkpointDbSecretRef
      name: mltk-postgres-conn
      type: Opaque
      namespace: same namespace as the AIService and schema setup Job
      delivery: envFrom to Runtime and schema setup Job
      required:
        - DATABASE_URL
        - PG_HOST
        - PG_PORT
        - PG_USER
        - PG_PASSWORD
        - PG_DBNAME
      exampleManifest: config/samples/ai_v1_aiplatform_agentruntime.yaml
      evidence: story-owner supplied Secret; existing sample matches the confirmed contract
