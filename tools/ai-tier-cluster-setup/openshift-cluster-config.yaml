# Splunk AI tier (AI POD) settings for OpenShift.
# Copy this file, replace environment-specific values, and pass the copy through
# CONFIG_FILE. Do not commit credentials.

# false: standard deployment (internet-connected). true: air-gapped deployment.
# An air-gapped deployment requires a Linux installer host with oc-mirror.
cluster:
  airgap: false

kubernetes:
  namespace: ai-platform

openshift:
  # Qualified OpenShift minor. Changing this value does not add support.
  requiredVersion: "4.21"

  # Controls the namespace-wide SCC grants for the AI workloads and Splunk AI
  # Operator. Component-specific grants for cert-manager, Local Path
  # Provisioner, OpenTelemetry, and Splunk Operator are always applied. Set
  # false only when the cluster administrator provides equivalent AI workload
  # and Splunk AI Operator permissions separately.
  grantPrivilegedSCC: "true"

  # auto labels every worker node; manual labels only the nodes listed below.
  nodeLabelStrategy: "manual"

  # AI-tier node pool used when nodeLabelStrategy is manual. CPU and GPU
  # workloads share this pool; GPU resource requests select GPU-capable nodes.
  nodes:
    - cc-40-f3-9f-e2-3c

  # External HTTP Routes. If host is omitted, the installer uses
  # <feature>.<default-ingress-domain>. HTTPS Route TLS and workload mTLS are
  # not configured or qualified by this installation workflow.
  routes:
    saia:
      enabled: true
      # host: "saia.apps.example.com"
    slim:
      enabled: true
      # host: "slim.apps.example.com"

images:
  # Optional prefix for image names that are not fully qualified. The release
  # defaults below use Docker Hub and are therefore not rewritten by this
  # value. For an air-gapped cluster, every image under images.* must already
  # exist in the internal registry; replace each public image reference with
  # its internal path.
  registry: ""
  # Keep false for a registry using trusted HTTPS. Set true only when insecure
  # access is explicitly required; it permits plain-HTTP pulls, adds the host
  # to OpenShift's insecureRegistries, and disables destination TLS verification
  # during an air-gap oc-mirror import.
  registryInsecure: false

  operator:
    image: "docker.io/splunk/splunk-ai-operator:v1.0"

  ray:
    headImage: "docker.io/splunk/ai-tier-ray-head:v1.0"
    workerImage: "docker.io/splunk/ai-tier-ray-worker:v1.0"

  weaviate:
    image: "docker.io/semitechnologies/weaviate:stable-v1.28-007846a"

  saia:
    apiImage: "docker.io/splunk/ai-tier-saia-api:v1.0"
    apiV2Image: "docker.io/splunk/ai-tier-saia-api-v2:v1.0"
    dataLoaderImage: "docker.io/splunk/ai-tier-saia-data-loader:v1.0"

  slim:
    apiImage: "docker.io/splunk/ai-tier-slim-service:v1.0"

  splunk:
    image: "docker.io/splunk/splunk:10.2-rhel9"
    operatorImage: "docker.io/splunk/splunk-operator:3.0.0"

  fluentBit:
    image: "docker.io/fluent/fluent-bit:1.9.6"

  otelCollector:
    image: "docker.io/otel/opentelemetry-collector-contrib:0.122.1"

  nginx:
    image: "docker.io/library/nginx:1.27-alpine"

storage:
  storageClass: "local-path"
  vectorDbSize: "50Gi"
  minimumDiskSpace:
    # Available GiB required on each AI-tier node at scale 1. The installer
    # multiplies it by aiPlatform.scaleFactor (1024 at scale 1; 2048 at 2).
    aiTierNode: 1024
  modelStaging:
    # true stages only missing or changed models from the installer machine.
    # false skips staging. Air-gapped installs verify completion markers before
    # platform installation; standard installs do not perform that pre-check.
    enabled: true
  objectStore:
    type: "seaweedfs"           # aws | s3compat | minio | seaweedfs
    bucket: "ai-platform-bucket"
    endpoint: "<S3_ENDPOINT_URL>"
    auth:
      rootUser: "<S3_ACCESS_KEY_ID>"
      rootPassword: "<S3_SECRET_ACCESS_KEY>"

splunk:
  standaloneName: splunk-standalone
  # Additional management/JWT issuers accepted by SAIA and SLIM. The installer
  # adds the primary short Splunk service URL automatically.
  trustedIssuers:
    - "https://splunk-splunk-standalone-standalone-service.ai-platform.svc.cluster.local:8089"

aiPlatform:
  name: "openshift-ai-platform"
  # GPU profile supported by this OpenShift installer.
  defaultAcceleratorType: "RTX_PRO_6000_BLACKWELL"
  # Capacity multiplier for model replicas, GPU workers, and the disk check.
  # Use an integer greater than or equal to 1.
  scaleFactor: 1
  workerGroupConfig:
    imageRegistry: ""
  serviceTemplate:
    # Keep feature Services internal when Routes provide external access.
    type: ClusterIP         # ClusterIP | NodePort | LoadBalancer
  features:
    - name: "saia"
      version: "1.1.0"
    - name: "slim"
      version: "1.0.0"
  cpuScheduling:
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"

operators:
  # Standard deployments use these OpenShift OLM CatalogSources. In air-gap mode,
  # the installer mirrors the required catalogs and substitutes the generated
  # internal CatalogSource names automatically.
  nfd:
    catalogSource: "redhat-operators"
  gpu:
    catalogSource: "certified-operators"
  ray:
    # Ray Serve application-package version expected in object storage.
    modelVersion: "v0.3.14-36-g1549f5a"
    # Ray runtime version; must match the Ray head and worker images.
    rayVersion: "2.56.0"

files:
  aiPlatform: "./artifacts.yaml"
  splunkOperator: "./splunk-operator-cluster.yaml"

# Optional authentication for a private registry. Air-gapped installs also use
# this block to authenticate the oc-mirror destination. When that destination
# is ECR, ecr.enabled alone is not enough for the earlier mirror import; provide
# a current ECR token here, in the cluster pull secret, or in a registry auth
# file. Leave disabled for public images. Do not commit real credentials.
imagePullSecrets:
  custom:
    enabled: false
    name: "custom-registry-secret"
    server: "registry.example.com"
    username: "<registry-username>"
    password: "<registry-password-or-token>"
    email: "<registry-account-email>"

# Amazon ECR workload authentication. When enabled, the installer uses AWS
# credentials from the environment or an instance profile to create pod pull
# secrets after air-gap mirror import. For an air-gapped ECR destination, also
# provide oc-mirror authentication as described under imagePullSecrets above.
# Set enabled to false when using another registry.
ecr:
  enabled: false
  account: ""
  region: "us-east-2"
