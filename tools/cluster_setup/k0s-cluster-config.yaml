# ===================================================================
# k0s Cluster Configuration for Splunk AI Platform
# ===================================================================
# Mirrors cluster-config.yaml (EKS) but adapted for k0s on bare-metal / EC2.
#
# Quick Start:
#   1. Copy: cp k0s-cluster-config.yaml my-k0s-config.yaml
#   2. Edit: vi my-k0s-config.yaml
#   3. Replace all values marked with "CHANGE THIS"
#   4. Run: CONFIG_FILE=./my-k0s-config.yaml ./k0s_cluster_with_stack.sh install
#
# Prerequisites (must be satisfied BEFORE running the installer):
#
# Local machine:
#   ssh, kubectl, helm, git, jq, yq — install via brew or your package manager
#   Example (macOS):  brew install kubectl helm git jq yq
#   Example (Linux):  apt-get install -y kubectl helm git jq && \
#                     wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && \
#                     chmod +x /usr/local/bin/yq
#
# All remote nodes (controllers + workers):
#   - SSH access using the key at cluster.sshKeyPath as cluster.sshUser
#   - Passwordless sudo: add to /etc/sudoers:
#       <sshUser> ALL=(ALL) NOPASSWD:ALL
#   - curl (used to download the k0s binary if not pre-installed)
#   - Internet access to https://get.k0s.sh and NVIDIA package repos
#     For airgapped clusters: pre-install k0s on all nodes and install
#     NVIDIA drivers manually before running this script
#   - python3 (pyyaml is installed automatically by the script via dnf/apt)
#   - Supported OS: RHEL/CentOS/Amazon Linux (dnf) or Ubuntu/Debian (apt)
#
# GPU worker nodes additionally require:
#   - Minimum 500 GB free on /var/lib/k0s (model weights are large)
#     Mount a dedicated disk at /var/lib/k0s before running if needed
#   - kernel-devel matching the running kernel (installer attempts this via dnf/apt)
# ===================================================================

# ---------- Cluster Configuration ----------
cluster:
  name: ai-cluster
  region: us-east-2                       # CHANGE THIS — required when storage.objectStore.type=aws (region of the S3 bucket); ignored for true on-prem
  sshKeyPath: ~/.ssh/id_rsa                  # CHANGE THIS: Path to SSH private key
  sshUser: root                       # CHANGE THIS: SSH user for remote nodes
  # airgap: false                         # Set to true for fully disconnected environments.
  #                                       # When true, the installer skips internet connectivity
  #                                       # checks for HuggingFace and NVIDIA package repos, and
  #                                       # assumes k0s + NVIDIA drivers are pre-installed on nodes.
  #                                       # Object store connectivity is still checked (it is local).
  #                                       # Can also be set via: AIRGAP_MODE=true (env var override).
  #                                       # install_from_airgap_bundle.sh sets this automatically.

# ---------- Node Configuration ----------
nodes:
  controllers: 1
  cpuWorkers: 1                           # Not used with existingIPs
  gpuWorkers: 2                           # Not used with existingIPs

  existingIPs:
    controllers:
      - 10.0.0.1                          # CHANGE THIS: Your controller server IP
    workers:
      - 10.0.0.2                          # CHANGE THIS: CPU worker 1
      - 10.0.0.3                          # CHANGE THIS: GPU worker 1
      - 10.0.0.4                          # CHANGE THIS: GPU worker 2

# ---------- Storage Configuration ----------
# Prerequisites (must be provisioned BEFORE running the installer):
#   - /var/lib/k0s must have at least 500 GB free on GPU workers
#   - /var/lib/k0s must have at least 200 GB free on CPU workers
#   - /var/lib/k0s must have at least 100 GB free on controllers
#   If using a dedicated disk, mount it at /var/lib/k0s before running this script.
#
# Object storage: AWS S3 or external S3-compatible (no in-cluster MinIO install).
# Use objectStore.type: aws (S3) or s3compat | minio | seaweedfs (external; endpoint + credentials required).
storage:
  storageClass: "local-path"                 # Storage class for Kubernetes PVCs (gp3, gp2, io1, io2)
  vectorDbSize: "50Gi"                       # VectorDB persistent volume size

  # Minimum available disk space (GB) on /var/lib/k0s per node role.
  # The installer checks these thresholds at preflight and fails if not met.
  # Override to lower values only if you know your workload footprint is smaller.
  # minimumDiskSpace:
  #   controller: 100    # k0s control plane, kine/etcd, container images
  #   cpuWorker: 200     # weaviate, saia-api, data-loader, fluent-bit
  #   gpuWorker: 500     # model weights (60-240 GB each), ray-worker-gpu image (~30 GB)

  # Model staging: download model artifacts from Hugging Face and upload them to
  # the object store during 'install' (before the cluster pulls them).
  #
  # Full install (default):  the installer will PROMPT you whether to download
  #   models — your answer overrides this value at runtime.
  # Silent install (--silent / AUTO_APPROVE=true):  this value is used as-is.
  #   Set false to skip — e.g. if models are already staged or you want to run
  #   the download separately via the 'stage-artifacts' subcommand.
  modelStaging:
    enabled: false

  objectStore:
    type: "minio"                                # aws | s3compat | minio | seaweedfs (external only for non-aws)
    bucket: "ai-platform-bucket-minio-us-east-2"
    endpoint: "http://10.0.0.5:9000"              # CHANGE THIS: MinIO/SeaweedFS/S3 API endpoint
    auth:
      rootUser: "<paste-AWS_ACCESS_KEY_ID-here>"          # CHANGE THIS — AWS_ACCESS_KEY_ID (AKIA…) or MinIO root user
      rootPassword: "<paste-AWS_SECRET_ACCESS_KEY-here>"  # CHANGE THIS — AWS secret OR MinIO root password; NEVER commit real keys

# ---------- Container Images Configuration ----------
images:
  # Registry prefix - applied to images without a full registry path
  registry: ""                                    # CHANGE THIS: Your ECR/Docker/Harbor registry (e.g. 123456789012.dkr.ecr.us-east-2.amazonaws.com)
  # Set to true when using a plain-HTTP (non-TLS) private registry such as a
  # local Docker registry or internal Harbor without HTTPS. When true:
  #   1. Preflight checks the registry over http:// instead of https://
  #   2. containerd on every node is configured to allow insecure pulls from
  #      this registry (hosts.toml for containerd v2, drop-in TOML for v1).
  # Leave false (default) for ECR, Docker Hub, or any HTTPS-backed registry.
  registryInsecure: false

  operator:
    image: "docker.io/splunk/splunk-ai-operator:0.2.0"

  splunk:
    image: "docker.io/splunk/splunk:10.2-rhel9"
    operatorImage: "docker.io/splunk/splunk-operator:3.0.0"

  ray:
    headImage: "splunk/ray-head-build-preview:latest"
    workerImage: "splunk/ray-worker-gpu-build-preview:latest"

  weaviate:
    image: "docker.io/semitechnologies/weaviate:stable-v1.28-007846a"

  saia:
    apiImage: "splunk/saia-api-build-preview:latest"
    apiV2Image: "splunk/saia-api-v2-build-preview:latest"
    dataLoaderImage: "splunk/saia-data-loader-build-preview:latest"

  # slim-api service image (consumed via RELATED_IMAGE_SLIM_API). Only needed
  # when the "slim" feature is enabled under aiPlatform.features[].
  slim:
    apiImage: "splunk/slim/slim-api:latest"

  fluentBit:
    image: "docker.io/fluent/fluent-bit:1.9.6"

  otelCollector:
    image: "docker.io/otel/opentelemetry-collector-contrib:0.122.1"

  # Reverse proxy used by the SAIA reconciler to route v1 / v2 requests by
  # path. Consumed via RELATED_IMAGE_NGINX. Point this at an internal mirror
  # for airgapped clusters.
  nginx:
    image: "docker.io/library/nginx:1.27-alpine"

  # Traefik HTTPS ingress (see the "ingress" block below). Only pulled/used
  # when ingress.enabled: true. The default image is NOT FIPS-certified — if
  # ingress.fips: "on", point this at your own approved FIPS-capable build.
  ingress:
    traefikImage: "docker.io/library/traefik:v3.6.25@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d"

# ---------- Operator Versions ----------
operators:
  ray:
    version: "v1.2.2"
    modelVersion: "v0.3.14-36-g1549f5a"
    rayVersion: "2.53.0"

  certManager:
    installCRDs: true

  nvidia:
    devicePluginVersion: "v0.17.3"

# ---------- Kubernetes ----------
kubernetes:
  namespace: ai-platform
  # clusterDomain: cluster.local  # UNCOMMENT to override if the cluster uses a non-default DNS domain

# ---------- File Paths ----------
files:
  splunkOperator: "./splunk-operator-cluster.yaml"  # CHANGE THIS: Path to Splunk Operator manifest
  aiPlatform: "./artifacts.yaml"                     # CHANGE THIS: Path to AI Platform artifacts

# ---------- Splunk Configuration ----------
splunk:
  # Splunk telemetry is OPT-IN and defaults to DISABLED.
  # When false (or absent): the Splunk Operator and Splunk Standalone are NOT
  # installed, and the AIPlatform CR is created WITHOUT a splunkConfiguration
  # block — the operator treats that as "no telemetry" and runs cleanly.
  # Set to true to enable telemetry (internal or external mode below).
  enabled: false

  # Name of the in-cluster Splunk Standalone CR (INTERNAL mode only).
  standaloneName: splunk-standalone

  # ----- Telemetry mode is derived from whether either external URL is set -----
  #
  #   INTERNAL (enabled: true, external URLs unset):
  #     The installer deploys the Splunk Operator + a Splunk Standalone inside
  #     the cluster and wires the AIPlatform CR at it. Requires
  #     images.splunk.image and images.splunk.operatorImage.
  #
  #   EXTERNAL (enabled: true, external URLs set):
  #     Use a Splunk running OUTSIDE the cluster. The installer does NOT deploy
  #     any in-cluster Splunk. It creates a Kubernetes Secret holding the HEC
  #     token and configures the management/JWKS and HEC endpoints separately.
  #
  #     The HEC token is supplied ONLY via the SPLUNK_HEC_TOKEN environment
  #     variable (never this file), so no live credential is committed or
  #     logged. Example:
  #
  #         export SPLUNK_HEC_TOKEN='<your-hec-token>'
  #         ./k0s_cluster_with_stack.sh --config k0s-cluster-config.yaml
  #
  #     The script creates the Secret AFTER the cluster/namespace exist, so
  #     there is no bootstrap ordering problem. Preflight fails fast if
  #     SPLUNK_HEC_TOKEN is missing in external mode.
  #
  # external:
  #   managementEndpoint: https://splunk.example.com:8089  # splunkd/JWKS URL and JWT issuer
  #   hecEndpoint: https://splunk.example.com:8088         # base HEC URL (operator appends /services/collector)
  #   secretName: splunk-hec-external             # optional; k8s Secret name the script creates (key: hec_token)
  #   caCertSecretName: splunk-external-ca        # optional; only needed if your Splunk cert is
  #                                                # signed by a private/internal CA. Pre-create the
  #                                                # Secret yourself (key: ca.crt) before running the
  #                                                # installer — it is never generated or modified here:
  #                                                #   kubectl create secret generic splunk-external-ca \
  #                                                #     --from-file=ca.crt=<path> -n ai-platform
  #                                                # Leave unset if your Splunk cert is publicly trusted;
  #                                                # SAIA falls back to its image's system trust store.
  #
  # `external.endpoint` is a deprecated compatibility alias. For standard
  # :8088/:8089 URLs the installer derives the other port and emits a warning;
  # custom ports must use both explicit keys above.

# ---------- AI Platform Configuration ----------
aiPlatform:
  name: "splunk-ai-stack"
  defaultAcceleratorType: "L40S"

  # scaleFactor: 2
  #   Optional, platform-wide. Runs the whole platform at N times its normal
  #   capacity — scales BOTH the model replicas AND the GPU worker pods
  #   together, so you never need to know which models exist or how many GPUs
  #   each one uses. Omit or set to 1 for the default single-capacity
  #   deployment. Your cluster must have proportionally more GPUs available
  #   before raising this (e.g. 2x the GPUs on the node pool for scaleFactor: 2).
  #   The value must be an integer greater than or equal to 1.

  workerGroupConfig:
    imageRegistry: ""

  # ---------- SAIA public exposure ----------
  # The SAIA "public" Service (nginx reverse proxy in front of v1 + v2 API
  # pods) defaults to ClusterIP — only reachable from inside the cluster. Two
  # call patterns hit it:
  #   (A) Splunk Enterprise pod   → saia-service   (works with ClusterIP)
  #   (B) End user's browser      → saia-service   (needs external exposure)
  #
  # Pattern B is used by the v2 chat UI (/query streaming, conversations,
  # feedback, admin endpoints). Without external exposure the v2 chat UI
  # breaks for users; v1 one-shot SPL still works.
  #
  # Choose the exposure type based on WHERE k0s runs:
  #
  #   NodePort   — the default/portable option; works everywhere (bare-metal,
  #                on-prem, AND cloud VMs like EC2). Opens a fixed port
  #                (default 30080) on every worker node; reach SAIA at
  #                http://<any-worker-ip>:<nodePort>. On a cloud VM, point an
  #                external load balancer (AWS NLB, GCP LB) at the worker nodes
  #                on this port to get a public DNS name. Use this whenever
  #                MetalLB/LoadBalancer is unavailable (i.e. any cloud VPC),
  #                since it has no L2 network assumptions. On bare-metal L2 you
  #                may instead prefer LoadBalancer below for a stable VIP.
  #
  #   LoadBalancer — only for TRUE bare-metal / on-prem k0s on a real L2 LAN,
  #                backed by MetalLB (see the metallb block below). MetalLB
  #                allocates a routable VIP and announces it via ARP (layer2)
  #                or BGP. This does NOT work on AWS/GCP/Azure VPCs: cloud
  #                fabrics drop the gratuitous ARP MetalLB relies on and only
  #                route to real ENI addresses, so the VIP is unreachable. On a
  #                cloud VM use NodePort + a cloud load balancer instead.
  #
  # To DISABLE external exposure (ClusterIP only), comment out the whole
  # serviceTemplate block AND set metallb.install: false.
  serviceTemplate:
    type: NodePort          # ClusterIP | NodePort | LoadBalancer
    nodePort: 30080         # Fixed NodePort (30000-32767) for the SAIA public service. Required only for NodePort.
    # AIPlatform.serviceTemplate propagates identically to EVERY feature's
    # AIService, so slim would otherwise inherit the same 30080 and collide with
    # SAIA (a NodePort can back only one Service). When the "slim" feature is
    # enabled under NodePort, the installer patches slim's public Service to this
    # DISTINCT port instead. Reach slim at http://<any-worker-ip>:<slimNodePort>.
    slimNodePort: 30081     # Fixed NodePort for the slim public service. Only used when slim is enabled + type=NodePort.

  features:
    - name: "saia"
      version: "1.1.0"
    # Enable the slim-api service (no v1/v2 routing). Exposed on slimNodePort above.
    - name: "slim"
      version: "1.0.0"

  cpuScheduling:
    nodeSelector: {}
    tolerations: []

  gpuScheduling:
    nodeSelector: {}
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

# ---------- MetalLB (k0s LoadBalancer provider) ----------
# ONLY for true bare-metal / on-prem k0s on a real L2 LAN, and ONLY when
# aiPlatform.serviceTemplate.type=LoadBalancer. Does NOT work on cloud VPCs
# (AWS/GCP/Azure) — see the SAIA public exposure notes above. Pinned chart
# version for supply-chain reproducibility (codeguard-0-supply-chain-security).
#
# If serviceTemplate.type=NodePort (the default), the installer skips MetalLB
# entirely even when metallb.install=true (NodePort does not use a
# LoadBalancer provider). Leave install: false unless you switch to
# LoadBalancer on bare-metal.
metallb:
  install: false                   # true only for bare-metal LoadBalancer; ignored under NodePort
  chartVersion: "0.14.8"           # metallb/metallb Helm chart (matches MetalLB v0.14.8)
  namespace: "metallb-system"

  # Address pool — a range of IPs MetalLB can hand out to LoadBalancer
  # Services. Must be routable from clients (VPN-connected users) to your k0s
  # workers. Use IPs that are NOT used elsewhere on the LAN.
  pool:
    name: "saia-pool"
    addresses:
      - "10.20.30.100-10.20.30.110"   # CHANGE THIS to a free range on your network

  # Advertisement mode: "layer2" works on most LANs without network gear
  # changes (one elected node answers ARP for the VIP at a time; failover ~
  # seconds). Use "bgp" only if your fabric supports BGP peering — then also
  # populate metallb.bgpPeers below.
  mode: "layer2"                  # layer2 | bgp

  # Required only when mode=bgp. Leave empty for layer2.
  bgpPeers: []
    # - peerAddress: "10.0.0.1"
    #   peerASN: 65001
    #   myASN: 65000

# ---------- Traefik HTTPS Ingress ----------
# OPT-IN, defaults to DISABLED. When false (or absent): none of this runs —
# your install behaves exactly as it does today (NodePort/tunnel access
# only). See TRAEFIK_HTTPS_DESIGN.md and TRAEFIK_HTTPS_SETUP.md.
#
# When enabled, the installer deploys Traefik v3 as a DaemonSet (one
# independent pod per worker node, hostPort-bound to that worker's own IP —
# there is no single shared controller address) terminating HTTPS for SAIA
# (:8443) and Splunk Web (:8000), plus an optional TCP-passthrough route for
# Splunk's management port (:8089). This is purely additive: existing
# NodePort/tunnel access keeps working unchanged either way.
ingress:
  enabled: false                 # master gate — set true to turn this on
  hostname: ""                   # optional DNS SAN for the cert; leave blank to
                                  # access via worker IP instead (any worker IP
                                  # works — see TRAEFIK_HTTPS_SETUP.md)
  fips: "off"                    # off | on — "on" requires you to also set
                                  # images.ingress.traefikImage to a FIPS-capable build
  tls:
    mode: selfsigned             # selfsigned is the only mode implemented today
  entryPoints:
    # Ports must be unique; 9000 is reserved for the controller health probe.
    saia:
      port: 8443
    splunkWeb:
      port: 8000
    splunkMgmt:
      port: 8089
      enabled: false              # opt in only when an external system needs direct
                                   # access to Splunk's management port

# ---------- Image Pull Secrets ----------
imagePullSecrets:
  secrets:
    - ecr-registry-secret
  autoCreateECR: true

ecr:
  account: ""                                        # CHANGE THIS: Your AWS account ID (e.g. 123456789012)
  region: us-east-2                                  # CHANGE THIS: Your AWS region
