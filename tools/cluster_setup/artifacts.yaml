    control-plane: controller-manager
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: splunk-ai-operator
  name: splunk-ai-operator-webhook-service
  namespace: splunk-ai-operator-system
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app.kubernetes.io/name: splunk-ai-operator
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: splunk-ai-operator
    control-plane: controller-manager
  name: splunk-ai-operator-controller-manager
  namespace: splunk-ai-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: splunk-ai-operator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: splunk-ai-operator
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        command:
        - /manager
        env:
        - name: WATCH_NAMESPACE
          value: WATCH_NAMESPACE_VALUE
        - name: RELATED_IMAGE_SPLUNK_ENTERPRISE
          value: splunk/splunk:10.2.0-dev1
        - name: OPERATOR_NAME
          value: splunk-operator
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RELATED_IMAGE_RAY_HEAD
          value: 658391232643.dkr.ecr.us-east-2.amazonaws.com/ml-platform/ray/ray-head:build-v2-008
        - name: RELATED_IMAGE_RAY_WORKER
          value: 658391232643.dkr.ecr.us-east-2.amazonaws.com/ml-platform/ray/ray-worker-gpu:build-v2-008
        - name: RELATED_IMAGE_WEAVIATE
          value: docker.io/semitechnologies/weaviate:stable-v1.28-007846a
        - name: RELATED_IMAGE_WEAVIATE_SERVICE
          value: docker.io/semitechnologies/weaviate:stable-v1.28-007846a
        - name: RELATED_IMAGE_SAIA_API
          value: 658391232643.dkr.ecr.us-east-2.amazonaws.com/ml-platform/saia/saia-api:build-v2-009
        - name: RELATED_IMAGE_SAIA_API_V2
          value: 658391232643.dkr.ecr.us-east-2.amazonaws.com/ml-platform/saia/saia-api-v2:build-v2-009
        - name: RELATED_IMAGE_POST_INSTALL_HOOK
          value: 658391232643.dkr.ecr.us-east-2.amazonaws.com/ml-platform/saia/saia-data-loader:build-v2-009
        - name: RELATED_IMAGE_FLUENT_BIT
          value: docker.io/fluent/fluent-bit:1.9.6
        - name: RELATED_IMAGE_OTEL_COLLECTOR
          value: docker.io/otel/opentelemetry-collector-contrib:0.122.1
        - name: RELATED_IMAGE_NGINX
          value: docker.io/library/nginx:1.27-alpine
        - name: MODEL_VERSION
          value: v0.3.14-36-g1549f5a
        - name: RAY_VERSION
          value: 2.53.0
        image: docker.io/kbhos698/splunk-ai-operator:ai-tier
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: splunk-ai-operator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: webhook-certs
        secret:
          secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: splunk-ai-operator
  name: splunk-ai-operator-metrics-certs
  namespace: splunk-ai-operator-system
spec:
  dnsNames:
  - SERVICE_NAME.SERVICE_NAMESPACE.svc
  - SERVICE_NAME.SERVICE_NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: splunk-ai-operator-selfsigned-issuer
  secretName: metrics-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: splunk-ai-operator
  name: splunk-ai-operator-serving-cert
  namespace: splunk-ai-operator-system
spec:
  dnsNames:
  - splunk-ai-operator-webhook-service.splunk-ai-operator-system.svc
  - splunk-ai-operator-webhook-service.splunk-ai-operator-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: splunk-ai-operator-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: splunk-ai-operator
  name: splunk-ai-operator-selfsigned-issuer
  namespace: splunk-ai-operator-system
spec:
  selfSigned: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: splunk-ai-operator
    control-plane: controller-manager
  name: splunk-ai-operator-controller-manager-metrics-monitor
  namespace: splunk-ai-operator-system
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    path: /metrics
    port: https
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      app.kubernetes.io/name: splunk-ai-operator
      control-plane: controller-manager
