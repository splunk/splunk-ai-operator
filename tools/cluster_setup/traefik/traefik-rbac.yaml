# Rendered by k0s_cluster_with_stack.sh. __AI_NAMESPACE__ is replaced with the
# configured AI namespace before apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: ingress
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: splunk-ai-ingress
    app.kubernetes.io/managed-by: splunk-ai-platform-installer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: splunk-ai-traefik
  namespace: __AI_NAMESPACE__
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: splunk-ai-ingress
    app.kubernetes.io/managed-by: splunk-ai-platform-installer
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources:
      - "ingressroutes"
      - "middlewares"
      - "middlewaretcps"
      - "ingressroutetcps"
      - "ingressrouteudps"
      - "tlsoptions"
      - "serverstransports"
      - "serverstransporttcps"
      - "tlsstores"
      - "traefikservices"
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: splunk-ai-traefik
  namespace: __AI_NAMESPACE__
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: splunk-ai-ingress
    app.kubernetes.io/managed-by: splunk-ai-platform-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: splunk-ai-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: ingress
