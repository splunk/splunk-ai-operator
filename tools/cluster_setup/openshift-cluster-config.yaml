# =============================================================================
# OpenShift Cluster Config for Splunk AI Platform
# =============================================================================
# Used by openshift_with_stack.sh
# =============================================================================

kubernetes:
  namespace: ai-platform

# OpenShift-specific settings
openshift:
  # Grant privileged SCC to Ray worker and operator service accounts.
  # Required when running GPU workloads (nvidia.com/gpu requests).
  # Set to "false" only if your cluster policy already covers this.
  grantPrivilegedSCC: "true"

  # Node labeling for the splunk.ai/ai-tier-node scheduler selector.
  # Both CPU and GPU workloads target this single AI-tier node pool; GPU workers
  # are pinned to GPU-capable nodes by their nvidia.com/gpu resource request.
  # Use "auto" to label all worker nodes automatically.
  # Use "manual" to specify node names explicitly below.
  nodeLabelStrategy: "manual"

  # Nodes that make up the AI-tier pool. List every node the AI platform should
  # run on — CPU workloads (weaviate, ray-head, saia-api) and GPU workloads
  # (ray-worker) both schedule here.
  nodes:
    - 00-25-b5-b5-00-35
    - 00-25-b5-b5-00-37
    - cc-40-f3-9f-e2-3c

images:
  # Registry prefix applied to images that are not fully qualified
  registry: "658391232643.dkr.ecr.us-east-2.amazonaws.com"

  operator:
    image: "658391232643.dkr.ecr.us-east-2.amazonaws.com/kiran/splunk/splunk-ai-operator:openshift-0.10"

  ray:
    headImage: "ml-platform/ray/ray-head:build-953"
    workerImage: "ml-platform/ray/ray-worker-gpu:build-953"

  weaviate:
    image: "docker.io/semitechnologies/weaviate:stable-v1.28-007846a"

  saia:
    apiImage: "ml-platform/saia/saia-api:build-v2-main-c3b489d"
    apiV2Image: "ml-platform/saia/saia-api-v2:build-v2-main-c3b489d"
    dataLoaderImage: "ml-platform/saia/saia-data-loader:build-v2-main-c3b489d"

  splunk:
    image: "658391232643.dkr.ecr.us-east-2.amazonaws.com/splunk/splunk:10-2-ai-custom"
    operatorImage: "docker.io/splunk/splunk-operator:3.0.0"

  fluentBit:
    image: "docker.io/fluent/fluent-bit:1.9.6"

  otelCollector:
    image: "docker.io/otel/opentelemetry-collector-contrib:0.122.1"

  nginx:
    image: "docker.io/library/nginx:1.27-alpine"

storage:
  storageClass: "local-path"
  vectorDbSize: "50Gi"
  objectStore:
    type: "seaweedfs"           # aws | s3compat | minio | seaweedfs
    bucket: "ai-platform-bucket"
    endpoint: "<S3_ENDPOINT_URL>"
    auth:
      rootUser: "<S3_ACCESS_KEY_ID>"
      rootPassword: "<S3_SECRET_ACCESS_KEY>"

splunk:
  # Splunk telemetry is OPT-IN and defaults to DISABLED.
  # When false (or absent): the Splunk Operator and Splunk Standalone are NOT
  # installed, and the AIPlatform CR is created WITHOUT a splunkConfiguration
  # block — the operator treats that as "no telemetry" and runs cleanly.
  # Set to true to enable telemetry (internal or external mode below).
  enabled: false

  # Name of the in-cluster Splunk Standalone CR (INTERNAL mode only).
  standaloneName: splunk-standalone

  # ----- Telemetry mode is derived from whether external.endpoint is set -----
  #
  #   INTERNAL (enabled: true, external.endpoint unset):
  #     The installer deploys the Splunk Operator + a Splunk Standalone inside
  #     the cluster and wires the AIPlatform CR at it. Requires
  #     images.splunk.image and images.splunk.operatorImage.
  #
  #   EXTERNAL (enabled: true, external.endpoint set):
  #     Use a Splunk running OUTSIDE the cluster. The installer does NOT deploy
  #     any in-cluster Splunk. It creates a Kubernetes Secret holding the HEC
  #     token and points the AIPlatform CR at your external HEC endpoint.
  #
  #     The HEC token is supplied ONLY via the SPLUNK_HEC_TOKEN environment
  #     variable (never this file), so no live credential is committed or
  #     logged. Example:
  #
  #         export SPLUNK_HEC_TOKEN='<your-hec-token>'
  #         ./openshift_with_stack.sh --config openshift-cluster-config.yaml
  #
  #     The script creates the Secret AFTER the cluster/namespace exist, so
  #     there is no bootstrap ordering problem. Preflight fails fast if
  #     SPLUNK_HEC_TOKEN is missing in external mode.
  #
  # external:
  #   endpoint: https://splunk.example.com:8088   # base HEC URL (operator appends /services/collector)
  #   secretName: splunk-hec-external             # optional; k8s Secret name the script creates (key: hec_token)
  #   caCertSecretName: splunk-external-ca        # optional; only needed if your Splunk cert is
  #                                                # signed by a private/internal CA. Pre-create the
  #                                                # Secret yourself (key: ca.crt) before running the
  #                                                # installer — it is never generated or modified here:
  #                                                #   oc create secret generic splunk-external-ca \
  #                                                #     --from-file=ca.crt=<path> -n ai-platform
  #                                                # Leave unset if your Splunk cert is publicly trusted;
  #                                                # SAIA falls back to its image's system trust store.

aiPlatform:
  name: "openshift-ai-platform"
  defaultAcceleratorType: "RTX_PRO_6000_BLACKWELL"
  # Fresh-install capacity multiplier for both model replicas and GPU workers.
  # Must be a YAML integer greater than or equal to 1.
  scaleFactor: 1
  workerGroupConfig:
    imageRegistry: ""
  serviceTemplate:
    type: NodePort
    nodePort: 30080
  features:
    - name: "saia"
      version: "1.1.0"
  cpuScheduling:
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"

operators:
  ray:
    modelVersion: "v0.3.14-36-g1549f5a"
    rayVersion: "2.53.0"

files:
  aiPlatform: "./artifacts.yaml"
  splunkOperator: "./splunk-operator-cluster.yaml"

# ECR pull secret — created automatically in all relevant namespaces during install.
# Requires AWS credentials in the environment (e.g. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# or an instance profile). Set enabled: false for non-ECR registries.
ecr:
  enabled: true
  account: "658391232643"
  region: "us-east-2"
