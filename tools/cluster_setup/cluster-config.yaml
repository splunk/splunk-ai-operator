# ===================================================================
# EKS Cluster Configuration Template for Splunk AI Platform
# ===================================================================
# IMPORTANT: This is a template file with placeholder values.
# Copy this file and replace ALL placeholder values with your actual AWS resources.
#
# Quick Start:
#   1. Copy: cp cluster-config.yaml my-cluster-config.yaml
#   2. Edit: vi my-cluster-config.yaml
#   3. Replace all values marked with "CHANGE THIS"
#   4. Run: CONFIG_FILE=./my-cluster-config.yaml ./eks_cluster_with_stack.sh install
# ===================================================================

# ---------- Cluster Configuration ----------
cluster:
  useExisting: false   # true = do not create cluster; use existing one (script fails if cluster not found)
  name: "ai-tier-sok-test-east2"                   # CHANGE THIS: Your EKS cluster name (DNS-1123 compliant: lowercase, numbers, hyphens)
  region: "us-east-2"                     # CHANGE THIS: Your AWS region (e.g., us-east-1, us-west-2, eu-west-1)
  k8sVersion: "1.31"                      # Kubernetes version (1.29, 1.30, 1.31 supported)
  # When true: require subnets (existing VPC). On 'delete', only EKS and related resources are removed; VPC is preserved so you can redeploy (e.g. with MinIO on EC2 in same VPC).
  preserveVpcOnDelete: false              # Set true to keep VPC on delete and redeploy without recreating VPC

  # To use an EXISTING VPC: provide subnets below; eksctl will not create a new VPC. Idempotent: cluster is only created if it does not exist.
  # If you do not provide subnets, eksctl creates a new VPC and subnets automatically.
  # VPC Subnets - CHANGE ALL OF THESE to your actual subnet IDs
  # Find your subnets: aws ec2 describe-subnets --filters "Name=vpc-id,Values=vpc-xxxxx" --region us-west-2
# subnets:
#    private:                              # Private subnets (at least 2 in different AZs)
#      - id: "subnet-02734905b10e7ad5a"    # CHANGE THIS: Your private subnet 1
#        az: "us-east-2b"                  # CHANGE THIS: Availability zone for subnet 1
#      - id: "subnet-0c1d7dc49788d11dc"    # CHANGE THIS: Your private subnet 2
#        az: "us-east-2c"                  # CHANGE THIS: Availability zone for subnet 2
#      - id: "subnet-0f8f94998d65dfcd2"    # CHANGE THIS: Your private subnet 2
#        az: "us-east-2a"   
#    public:                               # Public subnets (at least 2 in different AZs)
#      - id: "subnet-0f0ea3b190a618540"    # CHANGE THIS: Your public subnet 1
#        az: "us-east-2c"                  # CHANGE THIS: Availability zone for subnet 1
#      - id: "subnet-02b736130e7c2a787"    # CHANGE THIS: Your public subnet 2
#        az: "us-east-2a"                  # CHANGE THIS: Availability zone for subnet 2
#      - id: "subnet-02c35a8cd0b5d90a5"    # OPTIONAL: Additional public subnet for HA
#        az: "us-east-2b"                  # OPTIONAL: Third availability zone

# ---------- Node Groups ----------
#
# GPU TYPE QUICK REFERENCE — set instanceType and defaultAcceleratorType (under aiPlatform) together:
#
#   L40S  (default):
#     instanceType:        g6e.12xlarge    (4x L40S GPUs, 48 GB VRAM each)
#     defaultAcceleratorType: L40S
#     capacityReservation: not required
#     availabilityZones:   not required
#
#   H100:
#     instanceType:        p5.4xlarge      (8x H100 GPUs, 80 GB VRAM each; capacity reservation required)
#     defaultAcceleratorType: H100
#     capacityReservation: required — uncomment block below and set id + az
#     availabilityZones:   required — must match capacityReservation.az
#     maxSize:             must equal desiredCapacity (capacity reservations are fixed-size)
#
#   H100_NVL:
#     instanceType:        p4de.24xlarge   (8x H100 NVL GPUs, 94 GB VRAM each)
#     defaultAcceleratorType: H100_NVL
#     capacityReservation: not required
#     availabilityZones:   not required
#
nodeGroups:
  cpu:
    enabled: true                         # Set to false to skip CPU node group
    instanceType: "m5.xlarge"             # CPU instance type (m5.xlarge=4vCPU/16GB, m5.2xlarge=8vCPU/32GB)
    desiredCapacity: 4                    # Initial number of CPU nodes
    minSize: 2                            # Minimum nodes (for autoscaling)
    maxSize: 8                            # Maximum nodes (for autoscaling)
    volumeSize: 500                       # EBS volume size per node (GB)
    volumeType: "gp3"                     # EBS volume type (gp3 recommended, gp2, io1, io2)

  gpu:
    enabled: true                         # Set to false to skip GPU nodes (saves cost)
    instanceType: "g6e.12xlarge"          # CHANGE THIS: see GPU TYPE QUICK REFERENCE above
    desiredCapacity: 2                    # Initial number of GPU nodes
    minSize: 2                            # Minimum GPU nodes
    maxSize: 4                            # Maximum GPU nodes (set equal to desiredCapacity for H100)
    volumeSize: 1000                      # EBS volume size per GPU node (GB) - larger for model storage
    volumeType: "gp3"                     # EBS volume type

    # ── H100 ONLY ──────────────────────────────────────────────────────────────
    # Capacity Reservation: required for P5/H100 instances (scarce capacity).
    # Uncomment and fill in when defaultAcceleratorType is H100.
    # capacityReservation:
    #   id: "cr-xxxxxxxxxxxxxxxxx"        # CHANGE THIS: your capacity reservation ID
    #   az: "us-east-2c"                  # CHANGE THIS: AZ where the reservation exists

    # Availability Zones: lock GPU nodes to the AZ matching the capacity reservation.
    # Uncomment and fill in when defaultAcceleratorType is H100.
    # availabilityZones:
    #   - "us-east-2c"                    # CHANGE THIS: must match capacityReservation.az
    # ───────────────────────────────────────────────────────────────────────────

# ---------- Storage Configuration ----------
# Object storage: only AWS S3 or external S3-compatible (no in-cluster MinIO install).
# Use objectStore.type: aws (S3) or s3compat | minio | seaweedfs (external; endpoint + credentials required).
storage:
  s3Bucket: "ai-platform-bucket-minio-us-east-2"  # Used when objectStore.type is aws
  storageClass: "gp3"                        # Storage class for Kubernetes PVCs (gp3, gp2, io1, io2)
  vectorDbSize: "50Gi"                       # VectorDB persistent volume size

  # Object store: aws (S3) or external S3-compatible (s3compat, minio, seaweedfs). No in-cluster install.
  # - s3compat: generic S3 API (MinIO :9000, SeaweedFS S3 :8333, etc.) — AIPlatform path uses s3compat://bucket
  # - minio: same wiring as s3compat but path uses minio:// (use if an older operator webhook rejects s3compat://)
  # - seaweedfs: path uses seaweedfs:// (requires operator webhook that allows that scheme)
  objectStore:
    type: "minio"                         # aws | s3compat | minio | seaweedfs (external only for non-aws)
    bucket: "ai-platform-bucket-minio-us-east-2"
    endpoint: "http://13.59.216.105:9000"    # MinIO API (9000) or SeaweedFS S3 gateway (8333)
    auth:
      rootUser: "minioadmin"
      rootPassword: "minioadmin"              # Must match SeaweedFS env (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) or MinIO root

# ---------- Container Images Configuration ----------
images:
  # ==================================================================================
  # REGISTRY PREFIX - Applied to ALL images (unless image has full registry path)
  # ==================================================================================
  # This registry is automatically prepended to ALL image paths below UNLESS
  # the image path already contains a registry (e.g., docker.io/..., ghcr.io/...)
  #
  # HOW IT WORKS:
  # --------------
  # 1. If image path has NO registry → prepends 'registry' value
  #    Example: "ray/ray-head:v1" → "123456789012.dkr.ecr.us-west-2.amazonaws.com/ray/ray-head:v1"
  #
  # 2. If image path has FULL registry → uses as-is (ignores 'registry' value)
  #    Example: "docker.io/splunk/splunk:10.2.0" → "docker.io/splunk/splunk:10.2.0"
  #
  # 3. If 'registry' is empty → assumes Docker Hub for images without registry
  #    Example: "splunk/splunk:10.2.0" → "splunk/splunk:10.2.0" (Docker Hub)
  #
  # REQUIRED: Specify your private registry URL for custom images
  # Leave empty to use Docker Hub defaults for all images
  registry: "658391232643.dkr.ecr.us-east-2.amazonaws.com"  # CHANGE THIS: Your ECR/Docker/Harbor registry

  # ==================================================================================
  # CONTAINER IMAGES - Specify paths (registry prefix auto-applied if needed)
  # ==================================================================================

  # Splunk AI Operator Image
  operator:
    # Option 1: Relative path (uses registry prefix)
    #   image: "splunk-ai-operator:v1.0.0"
    #   Result: "123456789012.dkr.ecr.us-west-2.amazonaws.com/splunk-ai-operator:v1.0.0"
    #
    # Option 2: Full path (ignores registry prefix)
    #   image: "docker.io/myorg/splunk-ai-operator:v1.0.0"
    #   Result: "docker.io/myorg/splunk-ai-operator:v1.0.0"
    # Bump tag after building fixed operator (SAIA 8Gi default, SchemaJobId persist, feature config)
    #image: "658391232643.dkr.ecr.us-east-2.amazonaws.com/ml-platform/splunk-ai-operator:v0.1.8"
    image: "docker.io/kpratyush775/splunk-ai-operator:v0.1.32"

  # Splunk Enterprise Images
  splunk:
    # Splunk Enterprise image
    # Default behavior: If no registry in path, uses Docker Hub
    #   "splunk/splunk:10.2.0" → Docker Hub
    #   "123456789012.dkr.ecr.us-west-2.amazonaws.com/splunk/splunk:10.2.0" → ECR
    image: "658391232643.dkr.ecr.us-east-2.amazonaws.com/splunk/splunk:10-2-ai-custom"

    # Splunk Operator image (optional - has default)
    # Default: "docker.io/splunk/splunk-operator:3.0.0"
    operatorImage: "docker.io/splunk/splunk-operator:3.0.0"

  # Ray Images
  ray:
    # Option 1: Relative path (RECOMMENDED - uses registry prefix)
    #   headImage: "ray/ray-head:build-17"
    #   Result: "123456789012.dkr.ecr.us-west-2.amazonaws.com/ray/ray-head:build-17"
    #
    # Option 2: Full path with different registry
    #   headImage: "docker.io/rayproject/ray:2.44.0"
    #   Result: "docker.io/rayproject/ray:2.44.0"
    headImage: "ml-platform/ray/ray-head:build-008"
    workerImage: "ml-platform/ray/ray-worker-gpu:build-008"

  # Weaviate Vector Database
  weaviate:
    # Docker Hub public image (has full path, registry prefix ignored)
    # OR specify your mirrored image:
    #   image: "weaviate/weaviate:1.28.0"  → uses registry prefix
    image: "docker.io/semitechnologies/weaviate:stable-v1.28-007846a"

  # SAIA (Splunk AI Assistant) Images
  saia:
    # Relative paths - registry prefix auto-applied
    apiImage: "ml-platform/saia/saia-api:build-005"
    dataLoaderImage: "ml-platform/saia/saia-data-loader:build-003"

  # Supporting Images
  fluentBit:
    # Docker Hub public image (has full path, registry prefix ignored)
    # OR specify your mirrored image:
    #   image: "fluent-bit:1.9.6"  → uses registry prefix
    image: "docker.io/fluent/fluent-bit:1.9.6"

  # OpenTelemetry Collector (use full URL so it is not rewritten to ECR)
  otelCollector:
    # Public image - full path so registry prefix is NOT applied; validation checks this URL
    image: "docker.io/otel/opentelemetry-collector-contrib:0.122.1"

# ---------- Operator Versions ----------
operators:
  ray:
    version: "v1.2.2"                     # do not change Ray operator version
    modelVersion: "v0.3.14-36-g1549f5a"   # Model version for Ray
    rayVersion: "2.44.0"                  # Ray runtime version

  certManager:
    installCRDs: true              # no change

  nvidia:
    devicePluginVersion: "v0.17.3"  # no change

# ---------- AI Platform Configuration ----------
aiPlatform:
  namespace: "ai-platform" # no change
  name: "splunk-ai-stack" # no change

  # Service Accounts
  serviceAccounts:
    rayHead: "ray-head-sa" # no change
    rayWorker: "ray-worker-sa" # no change
    saiaService: "saia-service-sa" # no change

  # Default accelerator type — must match a top-level key in instance.yaml.
  # Must be changed in sync with nodeGroups.gpu.instanceType (see GPU TYPE QUICK REFERENCE above).
  #   L40S     → instanceType: g6e.12xlarge
  #   H100     → instanceType: p5.4xlarge    (also uncomment capacityReservation + availabilityZones)
  #   H100_NVL → instanceType: p4de.24xlarge
  defaultAcceleratorType: "L40S"

  # gpuWorkerConfig: define custom GPU types without rebuilding the operator image.
  # The operator merges these into the <name>-instances and <name>-feature-saia ConfigMaps
  # at reconcile time. Existing keys are never overwritten.
  # Uncomment and fill in when adding a GPU type not built into the operator image.
  #
  # gpuWorkerConfig:
  #   instanceTypes:
  #     H200:
  #       - tier: h200-0-gpu
  #         gpusPerPod: 0
  #         env:
  #           NVIDIA_VISIBLE_DEVICES: void
  #         resources:
  #           limits:
  #             cpu: "16"
  #             memory: "32Gi"
  #             ephemeral-storage: "10Gi"
  #             nvidia.com/gpu: "0"
  #           requests:
  #             cpu: "4"
  #       - tier: h200-1-gpu
  #         gpusPerPod: 1
  #         resources:
  #           requests:
  #             cpu: "4"
  #           limits:
  #             cpu: "16"
  #             memory: "96Gi"
  #             ephemeral-storage: "100Gi"
  #             nvidia.com/gpu: "1"
  #   instanceScale:
  #     H200:
  #       h200-0-gpu: 1
  #       h200-1-gpu: 2

  # Features to enable
  features: # no change
    - name: "saia"
      version: "1.1.0"
      serviceAccountName: "saia-service-sa"

  # Worker Group Configuration (replaces gpuConfigs)
  workerGroupConfig:
    serviceAccountName: "ray-worker-sa"
    imageRegistry: ""                     # Leave empty for default

  # CPU Scheduling
  cpuScheduling:
    nodeSelector: {}
    tolerations: []

  # GPU Scheduling
  gpuScheduling:
    nodeSelector: {}
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  # Ingress Configuration
  ingress: # not used
    enabled: false
    className: "nginx"
    host: "ai.example.com"
    tlsSecretName: "ai-platform-tls"

  # Certificate configuration
  certificate: # no change from user
    issuerName: "platform-issuer"

# ---------- Splunk Standalone Configuration ----------
splunkStandalone: # no change
  name: "splunk-standalone"
  serviceAccount: "saia-service-sa"

  appRepo:
    enabled: true
    appInstallPeriodSeconds: 90
    appsRepoPollIntervalSeconds: 60
    installMaxRetries: 2

  # Optional: Path to local Splunk app to upload
  # Leave empty to skip app upload
  localAppPath: ""                        # e.g., "/path/to/Splunk_AI_Assistant_Cloud.tgz"

# ---------- File Paths ----------
files:
  splunkOperatorManifest: "./splunk-operator-cluster.yaml"
  splunkAiOperatorManifest: "./artifacts.yaml"

# ---------- Advanced Settings ----------
advanced:
  # Cluster Autoscaler settings
  clusterAutoscaler:
    balanceSimilarNodeGroups: true
    skipNodesWithSystemPods: false
    expander: "least-waste"

  # Monitoring
  monitoring:
    kubePrometheus: true

  # OpenTelemetry
  openTelemetry:
    enabled: true
    namespace: "observability"
    collectorImage: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:latest"
