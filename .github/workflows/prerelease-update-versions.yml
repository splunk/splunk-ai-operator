name: Update Versions
on:
  workflow_call:
    inputs:
      old_operator_version:
        description: 'Current version (e.g. 0.1.0)'
        required: true
        type: string
      new_operator_version:
        description: 'Next version (e.g. 0.2.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      old_operator_version:
        description: 'Current version (e.g. 0.1.0)'
        required: true
      new_operator_version:
        description: 'Next version (e.g. 0.2.0)'
        required: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      # Need the write permission because this job commits changes to some folders like dist
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Deep Fetch
        run: |
          git fetch --prune --unshallow

      - name: Create ChangeLog since last release
        run: |
          git log $(git describe --tags --abbrev=0)..HEAD --oneline >> docs/ChangeLog-NEW.md

      - name: Read .env file
        id: dotenv
        run: |
          if [ -f .env ]; then
            while IFS='=' read -r key value; do
              # Skip comments and empty lines
              [[ "$key" =~ ^#.*$ ]] && continue
              [[ -z "$key" ]] && continue
              # Remove quotes and export
              value=$(echo "$value" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
              echo "$key=$value" >> $GITHUB_OUTPUT
            done < .env
          fi

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v5
        with:
          go-version: ${{ steps.dotenv.outputs.GO_VERSION }}
          cache: true
      - name: Update Helm Version
        if: inputs.old_operator_version != inputs.new_operator_version
        uses: jacobtomlinson/gha-find-replace@2ff30f644d2e0078fc028beb9193f5ff0dcad39e # v3
        with:
          find: "${{ inputs.old_operator_version }}"
          replace: "${{ inputs.new_operator_version }}"
          include: "helm-chart/**.yaml"
      - name: Update Operator Version in DOCS
        if: inputs.old_operator_version != inputs.new_operator_version
        uses: jacobtomlinson/gha-find-replace@2ff30f644d2e0078fc028beb9193f5ff0dcad39e # v3
        with:
          find: "${{ inputs.old_operator_version }}"
          replace: "${{ inputs.new_operator_version }}"
          include: "**.md"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          branch: "release/${{ inputs.new_operator_version }}"
          title: "Splunk AI Operator ${{ inputs.new_operator_version }} release"
          reviewers: "${{ steps.dotenv.outputs.REVIEWERS }}"
          body: |
            ### Automated Pull Request for Splunk AI Operator Release ${{ inputs.new_operator_version }}
            * Changes added to docs/ChangeLog-NEW.md. Please filter and update ChangeLog.md
            * Delete ChangeLog-New.md
