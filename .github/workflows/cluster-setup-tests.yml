name: Cluster Setup Tests
on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Ensure yq is available
        run: |
          if ! command -v yq &> /dev/null; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Run cluster_setup unit tests
        run: bash tools/cluster_setup/test_k0s_cluster_with_stack.sh

      - name: Run LAS deployment helper unit tests
        run: python3 tools/cluster_setup/test_las_deployment.py

      - name: Run LAS runtime acceptance helper tests
        run: |
          python3 tools/cluster_setup/test_las_runtime_acceptance.py
          python3 tools/cluster_setup/test_las_product_lifecycle_acceptance.py
          python3 -m py_compile \
            scripts/las-runtime-acceptance.py \
            scripts/las-product-lifecycle-acceptance.py \
            tools/cluster_setup/validation/aip5410_product_route_acceptance.py
          bash -n \
            scripts/las-restart-persistence-acceptance.sh \
            scripts/las-credential-rotation-acceptance.sh

      - name: Run ECR refresh rollout tests
        run: bash tools/cluster_setup/test_refresh_ecr_credentials.sh

      - name: Run Splunk-optional installer dry-run tests
        run: bash tools/cluster_setup/test_installer_dry_run.sh
