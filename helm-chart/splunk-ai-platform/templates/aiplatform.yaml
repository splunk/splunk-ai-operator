apiVersion: ai.splunk.com/v1
kind: AIPlatform
metadata:
  name: {{ include "splunk-ai-platform.fullname" . }}
  namespace: {{ include "splunk-ai-platform.namespace" . }}
  labels:
    {{- include "splunk-ai-platform.labels" . | nindent 4 }}
spec:
  # Object storage configuration (required)
  objectStorage:
    path: {{ .Values.objectStorage.path | required "objectStorage.path is required" | quote }}
{{- if .Values.objectStorage.endpoint }}
    endpoint: {{ .Values.objectStorage.endpoint | quote }}
{{- end }}
{{- if .Values.objectStorage.region }}
    region: {{ .Values.objectStorage.region | quote }}
{{- end }}
{{- if .Values.objectStorage.secretRef }}
    secretRef: {{ .Values.objectStorage.secretRef | quote }}
{{- end }}

{{- if .Values.serviceAccountName }}
  # Service account for platform components
  serviceAccountName: {{ .Values.serviceAccountName | quote }}
{{- end }}

{{- if .Values.gpuInstanceType }}
  # GPU instance type for Ray workers
  gpuInstanceType: {{ .Values.gpuInstanceType | quote }}
{{- end }}

  # Features configuration
{{- if .Values.features }}
  features:
{{- range .Values.features }}
{{- if .name }}
    - name: {{ .name | quote }}
{{- if .serviceAccountName }}
      serviceAccountName: {{ .serviceAccountName | quote }}
{{- end }}
{{- if .version }}
      version: {{ .version | quote }}
{{- end }}
{{- if .env }}
      env:
{{ toYaml .env | indent 8 }}
{{- end }}
{{- if .scaleFactor }}
      scaleFactor: {{ .scaleFactor }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.workerGroupConfig }}
  # Worker group configuration
  workerGroupConfig:
{{- if .Values.workerGroupConfig.serviceAccountName }}
    serviceAccountName: {{ .Values.workerGroupConfig.serviceAccountName | quote }}
{{- end }}
{{- if .Values.workerGroupConfig.imageRegistry }}
    imageRegistry: {{ .Values.workerGroupConfig.imageRegistry | quote }}
{{- end }}
{{- if .Values.workerGroupConfig.gpuConfigs }}
    gpuConfigs:
{{- toYaml .Values.workerGroupConfig.gpuConfigs | nindent 6 }}
{{- end }}
{{- end }}

{{- if .Values.sidecars }}
  # Sidecar injection configuration
  sidecars:
    envoy: {{ .Values.sidecars.envoy | default false }}
    otel: {{ .Values.sidecars.otel | default false }}
    prometheusOperator: {{ .Values.sidecars.prometheusOperator | default false }}
{{- end }}

{{- if .Values.certificateRef }}
  # Certificate reference for mTLS
  certificateRef: {{ .Values.certificateRef | quote }}
{{- end }}

  # Cluster domain for service DNS
  clusterDomain: {{ .Values.clusterDomain | default "cluster.local" | quote }}

{{- if .Values.images }}
  # Custom container images
  images:
{{- if .Values.images.saiaImage }}
    saiaImage: {{ .Values.images.saiaImage | quote }}
{{- end }}
{{- if .Values.images.weaviateImage }}
    weaviateImage: {{ .Values.images.weaviateImage | quote }}
{{- end }}
{{- if .Values.images.rayHeadGroupImage }}
    rayHeadGroupImage: {{ .Values.images.rayHeadGroupImage | quote }}
{{- end }}
{{- if .Values.images.rayWorkerGroupImage }}
    rayWorkerGroupImage: {{ .Values.images.rayWorkerGroupImage | quote }}
{{- end }}
{{- if .Values.images.imagePullSecrets }}
    imagePullSecrets:
{{- toYaml .Values.images.imagePullSecrets | nindent 6 }}
{{- end }}
{{- end }}

{{- if .Values.defaultAcceleratorType }}
  # Default GPU accelerator type
  defaultAcceleratorType: {{ .Values.defaultAcceleratorType | quote }}
{{- end }}

{{- if .Values.splunkConfiguration }}
  # Splunk configuration
  splunkConfiguration:
{{- toYaml .Values.splunkConfiguration | nindent 4 }}
{{- end }}

{{- if .Values.storage }}
  # Storage configuration
  storage:
{{- if .Values.storage.vectorDB }}
    vectorDB:
{{- if .Values.storage.vectorDB.pvcName }}
      pvcName: {{ .Values.storage.vectorDB.pvcName | quote }}
{{- end }}
{{- if .Values.storage.vectorDB.size }}
      size: {{ .Values.storage.vectorDB.size | quote }}
{{- end }}
{{- if .Values.storage.vectorDB.storageClassName }}
      storageClassName: {{ .Values.storage.vectorDB.storageClassName | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.gpuScheduler }}
  # GPU scheduling configuration
  gpuScheduler:
{{- toYaml .Values.gpuScheduler | nindent 4 }}
{{- end }}

{{- if .Values.cpuScheduler }}
  # CPU scheduling configuration
  cpuScheduler:
{{- toYaml .Values.cpuScheduler | nindent 4 }}
{{- end }}

{{- if .Values.ingress }}
  # Ingress configuration
  ingress:
{{- toYaml .Values.ingress | nindent 4 }}
{{- end }}

{{- if .Values.mtls }}
  # mTLS configuration
  mtls:
    enabled: {{ .Values.mtls.enabled | default false }}
{{- if .Values.mtls.issuerRef }}
    issuerRef:
{{- toYaml .Values.mtls.issuerRef | nindent 6 }}
{{- end }}
{{- if .Values.mtls.secretName }}
    secretName: {{ .Values.mtls.secretName | quote }}
{{- end }}
{{- if .Values.mtls.dnsNames }}
    dnsNames:
{{- toYaml .Values.mtls.dnsNames | nindent 6 }}
{{- end }}
{{- if .Values.mtls.termination }}
    termination: {{ .Values.mtls.termination | quote }}
{{- end }}
{{- end }}

{{- if .Values.serviceTemplate }}
  # Service template for Kubernetes services
  serviceTemplate:
{{- toYaml .Values.serviceTemplate | nindent 4 }}
{{- end }}
