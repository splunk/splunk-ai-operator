---
# Default values for splunk-ai-platform.
# This is a YAML-formatted file.
# Users can override these (e.g. via --values) to configure both the CR and the Ingress.

# ============================================================================
# Operator Installation
# ============================================================================
# The Splunk AI Operator and all its dependencies (cert-manager, kuberay,
# opentelemetry, prometheus, splunk-operator) should be installed separately.
#
# RECOMMENDED INSTALLATION (Two-step):
#   Step 1: helm install splunk-ai-operator ./splunk-ai-operator --namespace splunk-ai-operator-system --create-namespace
#   Step 2: helm install my-platform ./splunk-ai-platform --namespace my-namespace -f my-values.yaml
#
# For single-command installation (not recommended for production), set enabled=true:
#   helm install my-platform ./splunk-ai-platform --set splunk-ai-operator.enabled=true

splunk-ai-operator:
  # Set to true ONLY if you want to install the operator as part of this release
  # This can cause CRD ownership conflicts if you install multiple platform instances
  enabled: false

  # You can override dependency settings here if needed
  # For example, to disable specific operators:
  # cert-manager:
  #   enabled: false
  # kuberay-operator:
  #   enabled: false

# Metadata overrides:
# Override the Splunk AI Platform helm chart name
nameOverride: ""
# Override the Splunk AI Platform deployment name
fullnameOverride: ""
# Override the namespace for the Splunk AI Platform deployment
namespaceOverride: ""

# Storage volume
objectStorage:
  # Remote volume URI in the format s3://bucketname/<path prefix>
  path: ""
  # Optional override endpoint (only really needed for S3-compatible like MinIO)
  endpoint: ""
  # Region of the remote storage volume where apps reside. Used for aws, if provided. Not used for minio and azure.
  region: ""
  # Secret object name
  secretRef: ""

# Name of the service account to use for the AIPlatform
# used for Ray, Weaviate, SAIA, etc and also IAM role for S3 access
serviceAccountName: ""

# GpuInstanceType is the type of GPU instance to use for Ray worker groups
# e.g. "g6.24xlarge" or "p4d.24xlarge"
gpuInstanceType: "g6.24xlarge"

# Platform-wide capacity multiplier for both model replicas and worker pods.
# Must be an integer greater than or equal to 1.
scaleFactor: 1

# List of defined features to enable in the AI platform
# Options include: saia, seca, slim
features: []
# Example:
# - name: "saia"
#   serviceAccountName: "saia-service-sa"
#   version: "1.1.0"

# headGroupSpec:
#   # Service account name for the Ray head group
#   serviceAccountName: ""
#   # Image registries for Ray
#   imageRegistry: ""
#   nodeSelector: {}
#   affinity: {}
#   tolerations: []

# Define the Ray worker group configuration
workerGroupConfig:
  # Service account to use for Ray worker groups
  serviceAccountName: ""
  # Image registry to use for Ray worker groups
  imageRegistry: ""
  # GPU configurations for different worker tiers
  gpuConfigs: []
  # Example gpuConfigs:
  # - tier: "g6e.12xlarge-1-gpu"
  #   minReplicas: 0
  #   maxReplicas: 10
  #   gpusPerPod: 1
  #   resources:
  #     requests:
  #       cpu: "4"
  #       memory: "16Gi"
  #     limits:
  #       cpu: "16"
  #       memory: "32Gi"
  #       nvidia.com/gpu: "1"

# Toggles injection of sidecars
sidecars:
  # Enables the Envoy sidecar
  envoy: true
  # Enables the OpenTelemetry collector sidecar
  otel: true
  # Enables the Prometheus Operator sidecar
  prometheusOperator: true

# cert-manager issuer reference for the legacy mtls field's server TLS certificate
certificateRef: ""
# Internal cluster DNS suffix
clusterDomain: "cluster.local"

# Container images for platform components
# These override the default images set in the operator's environment variables
images:
  # Image for SAIA API service
  saiaImage: ""
  # Image for Weaviate vector database
  weaviateImage: ""
  # Image for Ray head group
  rayHeadGroupImage: ""
  # Image for Ray worker group
  rayWorkerGroupImage: ""
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Example:
  # - name: ecr-registry-secret
  # - name: dockerhub-secret

# Default GPU type to use for Ray worker groups
defaultAcceleratorType: ""

# SplunkConfigurationSpec instance reference (optional)
# Set to null or comment out if Splunk is not configured
# Uncomment and configure when Splunk integration is needed
splunkConfiguration: {}
# Example configuration:
# splunkConfiguration:
#   # CR of the SplunkConfiguration instance
#   splunkCustomResourceRef:
#     kind: "Standalone"
#     namespace: "default"
#     name: "splunk-standalone-stdln-0"
#     apiVersion: "enterprise.splunk.com/v4"
#   # Splunk credential Secret. Required whenever sidecars.otel is true and
#   # Splunk telemetry is configured; the collector cannot use Vault-only credentials.
#   secretRef:
#     name: "splunk-secret"
#     namespace: "default"
#   # Management/JWKS URL. This is not used as a HEC fallback.
#   endpoint: "https://splunk.default.svc.cluster.local:8089"
#   # Required when sidecars.otel is true and Splunk telemetry is configured.
#   hecEndpoint: "https://splunk.default.svc.cluster.local:8088"
#   # Optional, if not using secretRef
#   token: ""
#   # Whether token comes from Kubernetes Secret or Vault Agent, e.g. "kubernetes" or "vault"
#   secretSource: "kubernetes"
#   # Path where Vault Agent injects the Splunk HEC token
#   vaultFilePath: ""

# Specifies object storage for AI artifacts (e.g., S3 or GCS bucket)
storage:
  vectorDB:
    # Optional name of an existing PVC to use
    pvcName: ""
    # Size of the volume to create if PVCName is not provided
    size: "100Gi"  # e.g., "100Gi", "1Ti"
    # Optional StorageClassName to use for dynamic PVC provisioning
    storageClassName: ""  # e.g., "gp2", "standard", "azurefile"

# GPU and CPU scheduling configurations
gpuScheduler: {}
# Example:
# gpuScheduler:
#   tolerations:
#     - key: nvidia.com/gpu
#       operator: Exists
#       effect: NoSchedule
#   affinity:
#     nodeAffinity:
#       requiredDuringSchedulingIgnoredDuringExecution:
#         nodeSelectorTerms:
#           - matchExpressions:
#               - key: node.kubernetes.io/instance-type
#                 operator: In
#                 values:
#                   - g6e.12xlarge

cpuScheduler: {}
# Example:
# cpuScheduler:
#   tolerations: []
#   affinity:
#     nodeAffinity:
#       preferredDuringSchedulingIgnoredDuringExecution:
#         - weight: 1
#           preference:
#             matchExpressions:
#               - key: node.kubernetes.io/instance-type
#                 operator: In
#                 values:
#                   - m5.xlarge

# Ingress settings (optional)
# Note: This configures ingress at the AIPlatform CR level
ingress: {}
# Example:
# ingress:
#   enabled: true
#   className: "nginx"
#   annotations:
#     cert-manager.io/cluster-issuer: "letsencrypt-prod"
#   hosts:
#     - host: ai-platform.example.com
#       paths:
#         - path: /
#           pathType: Prefix
#   tls:
#     - secretName: ai-platform-tls
#       hosts:
#         - ai-platform.example.com

# One-way server TLS configuration for the AIPlatform. The key remains `mtls`
# for API compatibility; client certificates are not requested or validated.
mtls:
  # Enable or disable one-way server TLS on the SAIA service
  enabled: false
  # If Enabled, how to request the cert
  issuerRef:
    # Name of the resource being referred to
    name: ""
    # Kind of the resource being referred to
    kind: ""
    # Group of the resource being referred to
    group: ""
  # Server TLS certificate Secret reference
  secretName: ""
  dnsNames: []
  # Let users declare “I don’t want operator-managed TLS” even if Enabled=true, e.g. "operator" or "mesh"
  termination: "operator"

# Template used to create Kubernetes services
serviceTemplate:
  {}
  # spec:
  #   type: ClusterIP
