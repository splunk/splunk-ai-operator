# ============================================================================
# Dependency Management
# ============================================================================
# These operators are required by the Splunk AI Operator and are installed
# automatically as dependencies. Set to false if already installed in your cluster.

# cert-manager - Required for webhook certificates and mTLS
cert-manager:
  enabled: true
  crds:
    enabled: true

# KubeRay Operator - Required for Ray cluster management
kuberay-operator:
  enabled: true

# OpenTelemetry Operator - Required for observability sidecars
opentelemetry-operator:
  enabled: true
  manager:
    collectorImage:
      repository: "otel/opentelemetry-collector-k8s"
      tag: "0.102.1"

# Kube Prometheus Stack - Required for Prometheus monitoring
kube-prometheus-stack:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: false  # Minimal installation
  alertmanager:
    enabled: false  # Minimal installation

# Splunk Operator - Required for managing Splunk Enterprise instances
splunk-operator:
  enabled: true
  image:
    repository: docker.io/splunk/splunk-operator
    tag: 3.0.0

  # IMPORTANT: You MUST accept Splunk General Terms to use Splunk Operator
  # Review terms at: https://www.splunk.com/en_us/legal/splunk-general-terms.html
  #
  # To accept, set this value to true:
  #   --set splunk-operator.acceptGeneralTerms=true
  #
  # Or in your values.yaml:
  #   splunk-operator:
  #     acceptGeneralTerms: true
  #
  acceptGeneralTerms: false  # Must be explicitly set to true by user

  # Splunk-operator specific configuration
  splunkOperator:
    # SPLUNK_GENERAL_TERMS environment variable
    # This value must be obtained from the Splunk Operator README:
    # https://github.com/splunk/splunk-operator?tab=readme-ov-file#splunk-general-terms-acceptance
    # Leave empty by default to force user to explicitly accept terms
    splunkGeneralTerms: ""

# ============================================================================
# Splunk AI Operator Configuration
# ============================================================================

# Metadata overrides:
# Override the Splunk AI Operator helm chart name
nameOverride: ""
# Override the namespace for the Splunk AI Operator deployment
namespaceOverride: ""

# Add labels to Splunk AI Operator deployment
labels: {}

# Add annotations to Splunk AI Operator deployment
annotations: {}

# Add pod annotations to Splunk AI Operator deployment pod
podAnnotations:
  kubectl.kubernetes.io/default-container: manager

# Add pod labels to Splunk AI Operator deployment pod
podLabels: {}

# List namespaces to be watched by Splunk AI Operator e.x "namespace1,namespace2", must have cluster-wide access
# Default watches the entire cluster
# TODO: should we have an extra clusterWideAccess flag? If so, all of the rbac templates need to be updated
watchNamespace: ""

# Webhook configuration
webhook:
  enabled: true  # Enable webhook server for validating/mutating admission control
  port: 9443     # Webhook server port
# Container Images Configuration
# Configure all container images used by the AI Platform
# Supports both Docker Hub (docker.io/...) and private registries (ECR, GCR, etc.)

# Splunk Enterprise image
splunkEnterpriseImage: "docker.io/splunk/splunk:10.2.0"

# Ray cluster images
rayHeadImage: "docker.io/rayproject/ray:2.44.0"
rayWorkerImage: "docker.io/rayproject/ray:2.44.0-gpu"

# Weaviate vector database image
weaviateImage: "docker.io/semitechnologies/weaviate:stable-v1.28-007846a"
weaviateProxyImage: "docker.io/kbhos698/weaviate-service:v1.0.1"

# SAIA (Splunk AI Assistant) images
saiaApiImage: "docker.io/splunk/saia-api:1.1.0"
saiaSchemaImage: "docker.io/splunk/saia-data-loader:1.1.0"

# OpenTelemetry Collector sidecar image
otelCollectorImage: "docker.io/otel/opentelemetry-collector-contrib:0.122.1"

# Set security context for Splunk Operator pod
# reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.24/#podsecuritycontext-v1-core
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Splunk AI Operator image and pull policy
# reference: https://github.com/splunk/splunk-ai-operator
# Default uses Docker Hub for public releases
# You can also use GitHub Container Registry: ghcr.io/splunk/splunk-ai-operator
image:
  repository: docker.io/splunk/splunk-ai-operator
  tag: "v0.1.0"
  pullPolicy: IfNotPresent

# Define liveness probe to check if manager container is running
# reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

# Define readiness probe to check if manager container is ready for requests
# reference: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#types-of-probe
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Set resource requests and limits for manager container
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Specify volume mounts for the manager container, append additional volume mounts to list
# reference: https://kubernetes.io/docs/tasks/configure-pod-container/configure-volume-storage/
volumeMounts: []
# - mountPath:
#   name:

# Specify volumes for Splunk AI Operator pod, append additional volumes to list
# reference: https://kubernetes.io/docs/concepts/storage/volumes/
volumes: []
# - name:
#   persistentVolumeClaim:
#     claimName:

# Set duration in seconds the pod needs to terminate gracefully
# reference: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.20/#pod-v1-core
terminationGracePeriodSeconds: 10

# Set tolerations for Splunk AI Operator pod
tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: cpu
