{{- if .Release.IsUpgrade }}
{{- $namespace := include "splunk-ai-operator.namespace" . }}
{{- $name := printf "%s-runtime-upgrade-check" (include "splunk-ai-operator.fullname" . | trunc 41 | trimSuffix "-") }}
{{- $role := printf "%s-%s" $name (printf "%s/%s" $namespace .Release.Name | sha256sum | trunc 10) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $role }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [aiplatforms.ai.splunk.com, aiservices.ai.splunk.com]
    verbs: [get]
  - apiGroups: [ai.splunk.com]
    resources: [aiplatforms, aiservices]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $role }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-7"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-output-log-policy": hook-failed
spec:
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agentruntime-upgrade-preflight
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
{{- toYaml .Values.securityContext | nindent 8 }}
      tolerations:
{{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: validate
          image: {{ include "splunk-ai-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/manager"]
          args: ["--check-agentruntime-upgrade"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
{{- end }}
