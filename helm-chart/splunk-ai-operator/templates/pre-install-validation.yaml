{{- if index .Values "splunk-operator" "enabled" }}
{{- if not (index .Values "splunk-operator" "acceptGeneralTerms") }}
---
# This validation hook ensures users explicitly accept Splunk General Terms
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "splunk-ai-operator.fullname" . }}-terms-validation
  namespace: {{ include "splunk-ai-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  validation: |
    ===================================================================
    ERROR: Splunk General Terms Not Accepted
    ===================================================================

    You must explicitly accept the Splunk General Terms to install
    the Splunk Operator.

    Please review the terms at:
    https://www.splunk.com/en_us/legal/splunk-general-terms.html

    To accept the terms, add one of the following to your installation:

    Command line:
      --set splunk-operator.acceptGeneralTerms=true

    Values file:
      splunk-operator:
        acceptGeneralTerms: true

    Example installation:
      helm install splunk-ai-operator ./splunk-ai-operator \
        --namespace splunk-ai-operator-system \
        --create-namespace \
        --set splunk-operator.acceptGeneralTerms=true

    ===================================================================
---
# This job will fail the installation if terms are not accepted
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "splunk-ai-operator.fullname" . }}-terms-check
  namespace: {{ include "splunk-ai-operator.namespace" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "splunk-ai-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-install-validation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pre-install-validation
    spec:
      restartPolicy: Never
      containers:
      - name: terms-validator
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - |
          echo "============================================================"
          echo "ERROR: Splunk General Terms Not Accepted"
          echo "============================================================"
          echo ""
          echo "You must explicitly accept the Splunk General Terms to"
          echo "install the Splunk Operator."
          echo ""
          echo "Please review the terms at:"
          echo "https://www.splunk.com/en_us/legal/splunk-general-terms.html"
          echo ""
          echo "To accept, use:"
          echo "  --set splunk-operator.acceptGeneralTerms=true"
          echo ""
          echo "============================================================"
          exit 1
{{- end }}
{{- end }}
