# AIPlatform with ingress enabled

apiVersion: ai.splunk.com/v1
kind: AIPlatform
metadata:
  name: test-ingress-platform
spec:
  objectStorage:
    path: s3://test-bucket/artifacts
    region: us-west-2

  defaultAcceleratorType: nvidia-tesla-t4
  serviceAccountName: default

  # Ingress configuration
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: ai-platform.test.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - ai-platform.test.local
        secretName: ai-platform-tls

  splunkConfiguration:
    endpoint: http://test-splunk.default.svc.cluster.local:8088
    secretRef:
      name: test-splunk-secret
      
